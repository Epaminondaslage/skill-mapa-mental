name: Testes e exportação
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências de exportação
        run: python -m pip install cairosvg pypdf
      - name: Executar testes
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Gerar exemplo de infográfico
        run: python scripts/export_visual.py examples/infografico-tecnico.json --out build --paper a4 --orientation landscape
      - name: Verificar arquivos gerados
        run: |
          test -s build/mapa-01.svg
          test -s build/mapa-interativo.html
          test -s build/mapa-completo.pdf
          test -s build/mapa-01.png
      - name: Publicar artefatos de exemplo
        uses: actions/upload-artifact@v4
        with:
          name: infografico-tecnico-exemplo
          path: build/
